  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI-Assisted Loan Decision Study</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { background: #ffffff; }
    body { margin: 0; min-width: 320px; background: #ffffff; color: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    #trialTransition { position: fixed; inset: 0; z-index: 100; background: #09090b; opacity: 0; pointer-events: none; transition: opacity 250ms ease; }
    #trialTransition.is-dark { opacity: 1; pointer-events: auto; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 110; display: flex; align-items: center; justify-content: center; overflow-y: auto; background: rgb(15 23 42 / 0.62); padding: 1.25rem; }
    .modal-panel { width: min(100%, 34rem); max-height: calc(100vh - 2.5rem); overflow-y: auto; border-radius: 6px; border: 1px solid #cbd5e1; background: #ffffff; padding: 1.5rem; box-shadow: 0 20px 45px rgb(15 23 42 / 0.24); }
    .checkbox-row { display: flex; min-height: 3.25rem; cursor: pointer; align-items: center; gap: 0.75rem; padding: 0.75rem 0.25rem; color: #1e293b; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

</body>
</html>
