<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Assisted Loan Decision Experiment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .timer-bar {
      transition: width 80ms linear;
    }

    .modal-hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    .likert-input:checked + span {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.16);
    }

    .trial-transition {
      opacity: 0;
      pointer-events: none;
      transition: opacity 250ms ease;
    }

    .trial-transition.is-dark {
      opacity: 1;
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .trial-transition,
      .timer-bar,
      #reportModal {
        transition-duration: 0ms !important;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main id="app" class="min-h-screen"></main>

  <div
    id="reportModal"
    class="modal-hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 px-4 transition duration-150"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reportModalTitle"
  >
    <div class="w-full max-w-2xl rounded-lg bg-white p-6 shadow-xl">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p id="reportModalKicker" class="text-sm font-semibold uppercase tracking-wide text-slate-500">Decision recorded</p>
          <h2 id="reportModalTitle" class="mt-1 text-xl font-extrabold leading-7 text-slate-950">
            Which information did you rely on when making your final decision? Select all information that directly contributed to your choice. Do not select information that you noticed but did not use.
          </h2>
        </div>
        <span id="reportRtBadge" class="rounded-md border border-slate-200 bg-slate-50 px-3 py-1 text-sm font-bold tabular-nums text-slate-700"></span>
      </div>

      <fieldset id="reportOptions" class="mt-6 space-y-3"></fieldset>
      <div id="reportOtherContainer" class="mt-4 hidden">
        <label for="reportOtherText" class="text-sm font-bold text-slate-800">Briefly describe the other information you relied on.</label>
        <textarea
          id="reportOtherText"
          maxlength="240"
          rows="3"
          class="mt-2 w-full rounded-md border border-slate-300 px-3 py-2 text-base text-slate-900 focus:border-slate-600 focus:outline-none focus:ring-2 focus:ring-slate-200"
        ></textarea>
      </div>

      <p id="reportError" class="mt-4 hidden rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
        Please select at least one option.
      </p>

      <button
        id="submitReportButton"
        type="button"
        class="mt-6 w-full rounded-lg bg-slate-950 px-5 py-4 text-lg font-extrabold text-white shadow-md transition hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-300"
      >
        Submit and Continue
      </button>
    </div>
  </div>

  <div
    id="trialTransition"
    class="trial-transition fixed inset-0 z-40 bg-slate-950"
    aria-hidden="true"
  ></div>

  <script src="./fixed_stimuli.js"></script>
  <script src="./experiment_backend_client.js"></script>
  <script src="./experiment_persistence.js"></script>
  <script>
    (() => {
      "use strict";

      // EVIDENCE_REQUIRED: The 54 grey-zone profiles are model-estimated candidates, and the six obvious cases have intended design directions; neither is observed banking ground truth.
      // The six counterbalance lists embed no-AI ratings across the formal study, but those observed rates must remain distinct from model estimates.
      const FIXED_STIMULI = window.FIXED_STIMULI;
      const STIMULUS_SET_VERSION = window.STIMULUS_SET_VERSION;
      if (!Array.isArray(FIXED_STIMULI) || FIXED_STIMULI.length !== 60) {
        throw new Error("The fixed 60-trial stimulus manifest failed to load.");
      }
      const TOTAL_SESSION_TRIALS = FIXED_STIMULI.length;
      const REPORT_SCHEMA_VERSION = "v2_no_ai_recommendation_option";
      const TIMING_POLICY_VERSION = "pressure_v2_first10_30s_then50_15s";
      const API_CONTRACT_VERSION = window.EXPERIMENT_API_CONTRACT_VERSION || "v1";
      const CLIENT_BUILD_VERSION = "supabase-backend-v1";
      const TRANSITION_HALF_MS = 250;
      const BACKEND_CONFIG = window.EXPERIMENT_BACKEND_CONFIG || {
        mode: "local_only",
        apiBaseUrl: "",
        studyKey: "ai_assisted_loan_decision",
        consentVersion: "EVIDENCE_REQUIRED",
        consentGateSatisfied: false,
        allowUnapprovedConsentForSynthetic: false
      };
      const backendClient = window.createExperimentBackendClient(BACKEND_CONFIG);
      const COUNTERBALANCE_CONDITIONS = [
        { key: "no_ai", trialType: "no_ai_baseline", trialPhase: "phase_1_no_ai", cueIds: [] },
        { key: "ai_only", trialType: "ai_only_baseline", trialPhase: "phase_2_ai_only", cueIds: [] },
        { key: "W1_U1", trialType: "ai_plus_cues", trialPhase: "phase_3_ai_plus_cues", cueIds: ["W1", "U1"] },
        { key: "W1_U2", trialType: "ai_plus_cues", trialPhase: "phase_3_ai_plus_cues", cueIds: ["W1", "U2"] },
        { key: "W2_U1", trialType: "ai_plus_cues", trialPhase: "phase_3_ai_plus_cues", cueIds: ["W2", "U1"] },
        { key: "W2_U2", trialType: "ai_plus_cues", trialPhase: "phase_3_ai_plus_cues", cueIds: ["W2", "U2"] }
      ];

      const conditions = {
        pressure: {
          key: "pressure",
          label: "Time pressure",
          csvLabel: "15_seconds"
        },
        no_pressure: {
          key: "no_pressure",
          label: "No time limit",
          csvLabel: "no_time_limit"
        }
      };

      const params = new URLSearchParams(window.location.search);
      const prolificParticipantId = params.get("PROLIFIC_PID") || "";
      const isProlificSession = Boolean(prolificParticipantId);
      const prolificStudyId = params.get("STUDY_ID") || "";
      const prolificSessionId = params.get("SESSION_ID") || "";
      const developmentIdentity = isProlificSession ? null : getOrCreateDevelopmentIdentity();
      const localParticipantId = prolificParticipantId || developmentIdentity.participantId;
      const localSessionId = prolificSessionId || (
        isProlificSession
          ? getOrCreateProlificSessionId(prolificParticipantId, prolificStudyId)
          : developmentIdentity.sessionId
      );
      const clientInstanceId = getOrCreateClientInstanceId();
      const backendRequired = backendClient.mode === "backend_required";
      const seedParam = params.get("seed") || (backendRequired ? clientInstanceId : localParticipantId);
      const trialCount = TOTAL_SESSION_TRIALS;
      const initialConditionKey = normalizeCondition(params.get("condition") || params.get("time_pressure"));
      const counterbalance = resolveCounterbalanceList(
        params.get("counterbalance_list") || params.get("list"),
        backendRequired ? clientInstanceId : localParticipantId
      );

      const app = document.getElementById("app");
      const reportModal = document.getElementById("reportModal");
      const reportOptions = document.getElementById("reportOptions");
      const reportError = document.getElementById("reportError");
      const submitReportButton = document.getElementById("submitReportButton");
      const reportRtBadge = document.getElementById("reportRtBadge");
      const reportModalKicker = document.getElementById("reportModalKicker");
      const reportOtherContainer = document.getElementById("reportOtherContainer");
      const reportOtherText = document.getElementById("reportOtherText");
      const trialTransition = document.getElementById("trialTransition");

      const state = {
        clientInstanceId,
        participantId: backendRequired ? "" : localParticipantId,
        studyId: backendRequired ? String(BACKEND_CONFIG.studyKey || "ai_assisted_loan_decision") : prolificStudyId,
        sessionId: backendRequired ? "" : localSessionId,
        experimentSessionId: "",
        sessionWriteToken: "",
        backendSessionStarted: false,
        backendSessionResumed: false,
        backendCompletion: null,
        backendCompletionError: "",
        seed: seedParam,
        conditionKey: initialConditionKey,
        counterbalanceList: counterbalance.list,
        counterbalanceListSource: counterbalance.source,
        trialOrder: [],
        currentTrialIndex: 0,
        trialStartMs: 0,
        trialStartEpochMs: 0,
        trialElapsedBeforeResumeMs: 0,
        activeDeadlineMs: null,
        timerFrame: null,
        decisionLocked: false,
        transitioning: false,
        pendingResponse: null,
        responses: [],
        preSurvey: null,
        postSurvey: null,
        preSurveyCompleted: false,
        postSurveyCompleted: false
      };

      const persistence = window.createExperimentPersistence({
        storageKey: backendRequired
          ? `ai-loan-experiment:v5:${clientInstanceId}`
          : `ai-loan-experiment:v4:${localSessionId}`,
        backendClient,
        getBackendSession: () => ({
          experimentSessionId: state.experimentSessionId,
          sessionWriteToken: state.sessionWriteToken
        }),
        getSessionSnapshot: serializeSessionState,
        retryConfig: BACKEND_CONFIG.retry
      });
      const restoredSession = persistence.restore();

      function createUuid() {
        if (typeof crypto.randomUUID === "function") {
          return crypto.randomUUID();
        }

        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        return Array.from(bytes, (value, index) => {
          const hex = value.toString(16).padStart(2, "0");
          return [3, 5, 7, 9].includes(index) ? `-${hex}` : hex;
        }).join("");
      }

      function readIdentity(key) {
        try {
          const parsed = JSON.parse(window.localStorage.getItem(key) || "null");
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch {
          return null;
        }
      }

      function writeIdentity(key, value) {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch {
          // The experiment can still run with in-memory IDs if storage is unavailable.
        }
      }

      function getOrCreateDevelopmentIdentity() {
        const key = "ai-loan-experiment:development-identity";
        const existing = readIdentity(key);
        if (existing?.participantId && existing?.sessionId) {
          return existing;
        }

        const identity = {
          participantId: createUuid(),
          sessionId: createUuid()
        };
        writeIdentity(key, identity);
        return identity;
      }

      function getOrCreateClientInstanceId() {
        const key = "ai-loan-experiment:active-client-instance:v1";
        const existing = readIdentity(key);
        if (existing?.clientInstanceId) {
          return existing.clientInstanceId;
        }
        const identity = { clientInstanceId: createUuid() };
        writeIdentity(key, identity);
        return identity.clientInstanceId;
      }

      function getOrCreateProlificSessionId(stableParticipantId, stableStudyId) {
        const key = `ai-loan-experiment:prolific-session:${stableParticipantId}:${stableStudyId}`;
        const existing = readIdentity(key);
        if (existing?.sessionId) {
          return existing.sessionId;
        }

        const identity = { sessionId: createUuid() };
        writeIdentity(key, identity);
        return identity.sessionId;
      }

      function serializeSessionState() {
        return {
          stimulusSetVersion: STIMULUS_SET_VERSION,
          timingPolicyVersion: TIMING_POLICY_VERSION,
          apiContractVersion: API_CONTRACT_VERSION,
          clientBuildVersion: CLIENT_BUILD_VERSION,
          clientInstanceId: state.clientInstanceId,
          participantId: state.participantId,
          studyId: state.studyId,
          sessionId: state.sessionId,
          experimentSessionId: state.experimentSessionId,
          sessionWriteToken: state.sessionWriteToken,
          backendSessionStarted: state.backendSessionStarted,
          backendSessionResumed: state.backendSessionResumed,
          backendCompletion: state.backendCompletion,
          backendCompletionError: state.backendCompletionError,
          seed: state.seed,
          conditionKey: state.conditionKey,
          counterbalanceList: state.counterbalanceList,
          counterbalanceListSource: state.counterbalanceListSource,
          trialOrderIds: state.trialOrder.map((stimulus) => stimulus.trialId),
          currentTrialIndex: state.currentTrialIndex,
          trialStartEpochMs: state.trialStartEpochMs,
          activeDeadlineMs: state.activeDeadlineMs,
          pendingResponse: state.pendingResponse,
          responses: state.responses,
          preSurvey: state.preSurvey,
          postSurvey: state.postSurvey,
          preSurveyCompleted: state.preSurveyCompleted,
          postSurveyCompleted: state.postSurveyCompleted
        };
      }

      function restoreSessionState(saved) {
        if (
          !saved
          || saved.stimulusSetVersion !== STIMULUS_SET_VERSION
          || (saved.timingPolicyVersion && saved.timingPolicyVersion !== TIMING_POLICY_VERSION)
          || (saved.clientInstanceId && saved.clientInstanceId !== state.clientInstanceId)
        ) {
          return false;
        }

        if (!backendRequired && (
          saved.participantId !== state.participantId
          || saved.sessionId !== state.sessionId
        )) {
          return false;
        }

        state.participantId = saved.participantId || state.participantId;
        state.studyId = saved.studyId || state.studyId;
        state.sessionId = saved.sessionId || state.sessionId;
        state.experimentSessionId = saved.experimentSessionId || "";
        state.sessionWriteToken = saved.sessionWriteToken || "";
        state.backendSessionStarted = Boolean(saved.backendSessionStarted);
        state.backendSessionResumed = Boolean(saved.backendSessionResumed);
        state.backendCompletion = saved.backendCompletion || null;
        state.backendCompletionError = saved.backendCompletionError || "";
        state.seed = saved.seed;
        state.conditionKey = saved.conditionKey;
        state.counterbalanceList = saved.counterbalanceList;
        state.counterbalanceListSource = saved.counterbalanceListSource;
        const materialized = buildTrialOrder();
        const byTrialId = new Map(materialized.map((stimulus) => [stimulus.trialId, stimulus]));
        const restoredOrder = Array.isArray(saved.trialOrderIds)
          ? saved.trialOrderIds.map((trialId) => byTrialId.get(trialId)).filter(Boolean)
          : [];

        state.trialOrder = restoredOrder.length === TOTAL_SESSION_TRIALS
          ? restoredOrder
          : materialized;
        state.currentTrialIndex = Math.min(
          Number(saved.currentTrialIndex) || 0,
          state.trialOrder.length
        );
        state.trialStartEpochMs = Number(saved.trialStartEpochMs) || 0;
        state.activeDeadlineMs = Number.isFinite(saved.activeDeadlineMs)
          ? Number(saved.activeDeadlineMs)
          : null;
        state.pendingResponse = saved.pendingResponse || null;
        state.responses = Array.isArray(saved.responses) ? saved.responses : [];
        state.preSurvey = saved.preSurvey || null;
        state.postSurvey = saved.postSurvey || null;
        state.preSurveyCompleted = Boolean(saved.preSurveyCompleted);
        state.postSurveyCompleted = Boolean(saved.postSurveyCompleted);
        return state.preSurveyCompleted;
      }

      function checkpoint(reason) {
        return persistence.checkpoint(reason);
      }

      function trialIdempotencyKey(trialId) {
        return `${state.sessionId}:${trialId}`;
      }

      function questionnaireIdempotencyKey(stage) {
        return `${state.sessionId}:questionnaire:${stage}`;
      }

      function queueQuestionnaire(stage, responses) {
        if (backendRequired && !state.backendSessionStarted) {
          checkpoint("questionnaire_waiting_for_backend_session");
          return;
        }
        persistence.queueUpsert(questionnaireIdempotencyKey(stage), "questionnaire", {
          record_type: "questionnaire",
          questionnaire_stage: stage,
          participant_id: state.participantId,
          study_id: state.studyId,
          session_id: state.sessionId,
          stimulus_set_version: STIMULUS_SET_VERSION,
          timing_policy_version: TIMING_POLICY_VERSION,
          report_schema_version: REPORT_SCHEMA_VERSION,
          api_contract_version: API_CONTRACT_VERSION,
          client_build_version: CLIENT_BUILD_VERSION,
          condition: conditions[state.conditionKey].csvLabel,
          counterbalance_list: state.counterbalanceList,
          responses,
          saved_timestamp_iso: new Date().toISOString()
        });
      }

      function upsertResponse(response, reason) {
        const index = state.responses.findIndex(
          (candidate) => candidate.trial_id === response.trial_id
        );
        if (index >= 0) {
          state.responses[index] = response;
        } else {
          state.responses.push(response);
        }

        state.pendingResponse = response.report_completed === "true" ? null : response;
        checkpoint(reason);
        persistence.queueUpsert(response.backend_idempotency_key, "trial", response);
      }

      function consentContext() {
        const external = window.EXPERIMENT_CONSENT_CONTEXT;
        if (external && typeof external === "object") {
          return {
            granted: external.granted === true,
            version: String(external.version || "")
          };
        }
        return {
          granted: BACKEND_CONFIG.consentGateSatisfied === true,
          version: String(BACKEND_CONFIG.consentVersion || "")
        };
      }

      function backendStartIdentity() {
        if (isProlificSession) {
          if (!prolificStudyId || !prolificSessionId) {
            throw new Error("The Prolific STUDY_ID and SESSION_ID parameters are required.");
          }
          return {
            prolificPid: prolificParticipantId,
            prolificStudyId,
            prolificSessionId
          };
        }
        return {
          prolificPid: `synthetic-${state.clientInstanceId}`,
          prolificStudyId: "synthetic-development-study",
          prolificSessionId: `synthetic-session-${state.clientInstanceId}`
        };
      }

      async function ensureBackendSession(options = {}) {
        if (!backendRequired) {
          return;
        }
        if (state.backendSessionStarted && state.sessionWriteToken && options.reconcile !== true) {
          return;
        }
        const consent = consentContext();
        const syntheticConsentAllowed = !isProlificSession
          && BACKEND_CONFIG.allowUnapprovedConsentForSynthetic === true;
        if (
          !consent.granted
          || !consent.version
          || (consent.version === "EVIDENCE_REQUIRED" && !syntheticConsentAllowed)
        ) {
          throw new Error("An approved consent gate and consent version must be configured before backend collection.");
        }

        const identity = backendStartIdentity();
        const result = await backendClient.startSession({
          study_key: String(BACKEND_CONFIG.studyKey || "ai_assisted_loan_decision"),
          prolific_pid: identity.prolificPid,
          prolific_study_id: identity.prolificStudyId,
          prolific_session_id: identity.prolificSessionId,
          client_instance_id: state.clientInstanceId,
          stimulus_set_version: STIMULUS_SET_VERSION,
          timing_policy_version: TIMING_POLICY_VERSION,
          consent_version: consent.version,
          client_build_version: CLIENT_BUILD_VERSION
        });

        if (
          result.stimulus_set_version !== STIMULUS_SET_VERSION
          || result.timing_policy_version !== TIMING_POLICY_VERSION
          || !conditions[result.assignment?.condition_key]
          || !Number.isInteger(Number(result.assignment?.counterbalance_list))
          || Number(result.assignment.counterbalance_list) < 1
          || Number(result.assignment.counterbalance_list) > 6
        ) {
          throw new Error("The backend returned an invalid experiment assignment.");
        }
        if (
          state.experimentSessionId
          && state.experimentSessionId !== result.experiment_session_id
        ) {
          throw new Error("The restored session does not match the server session.");
        }
        if (
          state.backendSessionStarted
          && (state.conditionKey !== result.assignment.condition_key
            || Number(state.counterbalanceList) !== Number(result.assignment.counterbalance_list))
        ) {
          throw new Error("The restored assignment does not match the server assignment.");
        }

        state.experimentSessionId = result.experiment_session_id;
        state.sessionWriteToken = result.session_write_token;
        state.backendSessionStarted = true;
        state.backendSessionResumed = Boolean(result.resumed);
        state.participantId = result.experiment_session_id;
        state.sessionId = result.experiment_session_id;
        state.studyId = String(BACKEND_CONFIG.studyKey || "ai_assisted_loan_decision");
        state.conditionKey = result.assignment.condition_key;
        state.counterbalanceList = Number(result.assignment.counterbalance_list);
        state.counterbalanceListSource = "server_atomic_allocation";
        checkpoint("backend_session_reconciled");
      }

      function normalizeCondition(value) {
        const normalized = String(value || "").trim().toLowerCase();
        if (["no_pressure", "no_time_limit", "none", "no", "unlimited", "control", "low"].includes(normalized)) {
          return "no_pressure";
        }
        return "pressure";
      }

      function resolveCounterbalanceList(value, stableParticipantId) {
        const parsed = Number.parseInt(value, 10);
        if (Number.isInteger(parsed) && parsed >= 1 && parsed <= 6) {
          return { list: parsed, source: "url_parameter" };
        }
        return {
          list: (hashString(stableParticipantId) % COUNTERBALANCE_CONDITIONS.length) + 1,
          source: "participant_hash_fallback"
        };
      }

      function hashString(value) {
        let hash = 2166136261;
        const text = String(value);
        for (let index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function mulberry32(seed) {
        return function random() {
          let t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function shuffle(items, random) {
        const copy = [...items];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(random() * (index + 1));
          [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
        }
        return copy;
      }

      function formatCurrency(value) {
        return `€${Number(value).toLocaleString("en-US")}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function oppositeDecision(decision) {
        return decision === "APPROVE" ? "REJECT" : "APPROVE";
      }

      function decisionTone(decision) {
        return decision === "APPROVE"
          ? {
              badge: "border-emerald-200 bg-emerald-50 text-emerald-700",
              text: "text-emerald-700"
            }
          : {
              badge: "border-red-200 bg-red-50 text-red-700",
              text: "text-red-700"
            };
      }

      function cloneStimulus(stimulus) {
        return {
          ...stimulus,
          applicant: { ...stimulus.applicant },
          cues: stimulus.cues.map((cue) => ({ ...cue })),
          warrantedCue: stimulus.warrantedCue ? { ...stimulus.warrantedCue } : null,
          unwarrantedCue: stimulus.unwarrantedCue ? { ...stimulus.unwarrantedCue } : null
        };
      }

      function materializeStimulus(profile, profileIndex) {
        const blockIndex = Math.floor(profileIndex / 10);
        const listIndex = state.counterbalanceList - 1;
        const assignedIndex = (blockIndex - listIndex + COUNTERBALANCE_CONDITIONS.length)
          % COUNTERBALANCE_CONDITIONS.length;
        const assigned = COUNTERBALANCE_CONDITIONS[assignedIndex];
        let cues = assigned.cueIds.map((cueId) => ({ ...profile.cueBank[cueId] }));

        // Presentation order is fixed for each applicant-condition pairing and never depends on the participant.
        if (cues.length === 2 && (profileIndex + assignedIndex) % 2 === 1) {
          cues = [...cues].reverse();
        }
        cues = cues.map((cue, cueIndex) => ({ ...cue, presentationPosition: cueIndex + 1 }));

        return {
          ...profile,
          applicant: { ...profile.applicant },
          counterbalanceBlock: blockIndex + 1,
          assignedCondition: assigned.key,
          trialType: assigned.trialType,
          trialPhase: assigned.trialPhase,
          stimulusType: profile.stimulusType || "grey_zone",
          isObviousCase: Boolean(profile.isObviousCase),
          intendedObviousDirection: profile.intendedObviousDirection || "",
          cueCombination: assigned.key.startsWith("W") ? assigned.key : "none",
          cues,
          warrantedCue: cues.find((cue) => cue.category === "warranted") ?? null,
          unwarrantedCue: cues.find((cue) => cue.category === "unwarranted") ?? null,
          askRetrospectiveReport: assigned.trialType === "ai_plus_cues"
        };
      }

      function getTrialDeadlineMs(stimulus) {
        if (state.conditionKey === "no_pressure") {
          return null;
        }
        return stimulus.trialType === "no_ai_baseline" ? 30000 : 15000;
      }

      function getDeadlinePolicy(stimulus) {
        if (state.conditionKey === "no_pressure") {
          return "no_deadline";
        }
        return stimulus.trialType === "no_ai_baseline"
          ? "no_ai_baseline_30000ms"
          : "ai_trials_15000ms";
      }

      function buildTrialOrder() {
        const random = mulberry32(hashString(`${state.seed}-presentation-order`));
        const phases = ["phase_1_no_ai", "phase_2_ai_only", "phase_3_ai_plus_cues"];
        const assignedStimuli = FIXED_STIMULI.map(materializeStimulus);

        return phases.flatMap((phase) => {
          const phaseTrials = assignedStimuli
            .filter((stimulus) => stimulus.trialPhase === phase)
            .map(cloneStimulus);
          return shuffle(phaseTrials, random);
        });
      }

      function transitionDelay() {
        return window.matchMedia("(prefers-reduced-motion: reduce)").matches

        return new Promise((resolve) => requestAnimationFrame(() => resolve()));

        cancelAnimationFrame(state.timerFrame);

        await wait(transitionDelay());

        renderTrial();
        await nextFrame();
        trialTransition.classList.remove("is-dark");
        await wait(transitionDelay());

        state.transitioning = false;
        if (state.pendingResponse && state.pendingResponse.report_completed !== "true") {

      function cueCard(cue) {
        return `

          </article>
        `;
      }

      function activateTrialTiming(resume) {
        const stimulus = state.trialOrder[state.currentTrialIndex];
        state.activeDeadlineMs = getTrialDeadlineMs(stimulus);

        if (resume && state.trialStartEpochMs > 0) {
          state.trialElapsedBeforeResumeMs = Math.max(
            0,
            Date.now() - state.trialStartEpochMs
          );
        } else {
          state.trialStartEpochMs = Date.now();
          state.trialElapsedBeforeResumeMs = 0;
        }

        state.trialStartMs = performance.now();
        checkpoint(resume ? "trial_resumed" : "trial_started");
        startTimer();
      }

      function currentTrialElapsedMs() {
        return state.trialElapsedBeforeResumeMs
          + Math.max(0, performance.now() - state.trialStartMs);
      }

      function startTimer() {
        const deadlineMs = state.activeDeadlineMs;
        const timerText = document.getElementById("timerText");
        const timerBar = document.getElementById("timerBar");

        if (!deadlineMs) {
          return;
        }

        function updateTimer() {
          if (state.decisionLocked) {
            return;
          }

          const elapsed = currentTrialElapsedMs();
          const remaining = Math.max(deadlineMs - elapsed, 0);
          const percentage = (remaining / deadlineMs) * 100;

          timerText.textContent = `${(remaining / 1000).toFixed(2).padStart(5, "0")}s`;
          timerBar.style.width = `${percentage}%`;

          if (remaining <= 0) {
            recordDecision("timeout");
            return;
          }

          state.timerFrame = requestAnimationFrame(updateTimer);
        }

        if (currentTrialElapsedMs() >= deadlineMs) {
          recordDecision("timeout");
          return;
        }
        state.timerFrame = requestAnimationFrame(updateTimer);
      }

      function recordDecision(userChoice) {
        if (state.decisionLocked) {
          return;

        state.decisionLocked = true;
        stopTimer();

        const stimulus = state.trialOrder[state.currentTrialIndex];
        const applicant = stimulus.applicant;
        const condition = conditions[state.conditionKey];
        const reactionTimeMs = Math.max(0, Math.round(currentTrialElapsedMs()));
        let userFinalDecision = "";

          if (stimulus.trialType === "no_ai_baseline") {
            userFinalDecision = userChoice === "approve_loan" ? "APPROVE" : "REJECT";

              ? applicant.aiRecommendation

        const warrantedCue = stimulus.warrantedCue;

        const aiWasShown = stimulus.trialType !== "no_ai_baseline";
        const timedOut = userChoice === "timeout";
        const reportWillBeShown = stimulus.askRetrospectiveReport && !timedOut;
        const backendIdempotencyKey = trialIdempotencyKey(stimulus.trialId);

        state.pendingResponse = {
          record_type: "trial",
          participant_id: state.participantId,
          study_id: state.studyId,
          session_id: state.sessionId,
          experiment_session_id: state.experimentSessionId,
          seed: state.seed,

          timing_policy_version: TIMING_POLICY_VERSION,
          api_contract_version: API_CONTRACT_VERSION,
          client_build_version: CLIENT_BUILD_VERSION,
          condition: condition.csvLabel,
          counterbalance_list: state.counterbalanceList,
          counterbalance_list_source: state.counterbalanceListSource,
          counterbalance_block: stimulus.counterbalanceBlock,
          assigned_condition: stimulus.assignedCondition,
          trial_number: state.currentTrialIndex + 1,
          trial_order: state.currentTrialIndex + 1,
          presentation_order: state.currentTrialIndex + 1,
          trial_id: stimulus.trialId,
          trial_type: stimulus.trialType,
          trial_phase: stimulus.trialPhase,
          trial_deadline_ms: state.activeDeadlineMs ?? "",
          trial_deadline_seconds: state.activeDeadlineMs ? state.activeDeadlineMs / 1000 : "",
          deadline_policy: getDeadlinePolicy(stimulus),
          timer_started_timestamp_iso: state.trialStartEpochMs
            ? new Date(state.trialStartEpochMs).toISOString()
            : "",
          transition_duration_ms: transitionDelay() * 2,
          rt_excludes_transition: "true",
          report_prompt_shown: String(reportWillBeShown),
          report_schema_version: REPORT_SCHEMA_VERSION,
          conflict_validation_status: stimulus.conflictValidationStatus,
          observed_no_ai_approve_rate: stimulus.observedNoAiApproveRate,
          stimulus_type: stimulus.stimulusType,
          is_obvious_case: String(stimulus.isObviousCase),
          intended_obvious_direction: stimulus.intendedObviousDirection,
          model_estimated_approval_propensity: applicant.modelEstimatedApprovalPropensity,
          model_latent_score: applicant.modelLatentScore,
          affordability_signal: applicant.affordabilitySignal,
          credit_signal: applicant.creditSignal,
          savings_signal: applicant.savingsSignal,
          cue_combination: stimulus.cueCombination,
          warranted_cue_id: warrantedCue?.id ?? "",
          warranted_cue_type: warrantedCue?.type ?? "",
          warranted_cue_text: warrantedCue?.text ?? "",
          warranted_cue_metric: warrantedCue?.metric ?? "",
          warranted_cue_metric_name: warrantedCue?.metricName ?? "",
          unwarranted_cue_id: unwarrantedCue?.id ?? "",
          unwarranted_cue_type: unwarrantedCue?.type ?? "",
          unwarranted_cue_text: unwarrantedCue?.text ?? "",
          unwarranted_cue_metric: unwarrantedCue?.metric ?? "",
          unwarranted_cue_metric_name: unwarrantedCue?.metricName ?? "",
          cue_1_id: cue1?.id ?? "",
          cue_1_category: cue1?.category ?? "",
          cue_1_type: cue1?.type ?? "",
          cue_1_text: cue1?.text ?? "",
          cue_1_metric: cue1?.metric ?? "",
          cue_1_metric_name: cue1?.metricName ?? "",
          cue_2_id: cue2?.id ?? "",
          cue_2_category: cue2?.category ?? "",
          cue_2_type: cue2?.type ?? "",
          cue_2_text: cue2?.text ?? "",
          cue_2_metric: cue2?.metric ?? "",
          cue_2_metric_name: cue2?.metricName ?? "",
          applicant_id: applicant.applicantId,
          annual_income_eur: applicant.income,
          requested_loan_eur: applicant.loanAmount,
          repayment_term_years: applicant.repaymentTermYears,
          credit_score: applicant.creditScore,
          savings_eur: applicant.savings,
          annual_repayment_burden_pct: applicant.annualRepaymentBurdenPct,
          loan_to_income_pct: applicant.loanToIncomePct,
          savings_to_loan_pct: applicant.savingsToLoanPct,
          model_estimated_class: applicant.modelEstimatedClass,
          ai_recommendation: applicant.aiRecommendation,
          ai_recommendation_shown: String(aiWasShown),
          ai_matches_model_estimate_synthetic: aiWasShown ? String(applicant.aiIsCorrect) : "",
          user_choice: userChoice,
          user_agreed_with_ai: timedOut || !aiWasShown ? "" : String(userChoice === "agree_ai"),
          user_final_decision: userFinalDecision,
          user_decision_matches_model_estimate: timedOut
            ? ""
            : String(userFinalDecision === applicant.modelEstimatedClass),
          obvious_response_matches_direction: timedOut || !stimulus.isObviousCase
            ? ""
            : String(userFinalDecision === stimulus.intendedObviousDirection),
          decision_rt_ms: reactionTimeMs,
          decision_rt_seconds: (reactionTimeMs / 1000).toFixed(3),
          timed_out: String(timedOut),
          decision_timestamp_iso: new Date().toISOString(),
          report_completed: String(!reportWillBeShown),
          reported_information: "",
          reported_cue_ids: "",
          reported_cue_categories: "",
          reported_warranted_cue: "",
          reported_unwarranted_cue: "",
          reported_ai_recommendation: "",
          reported_other: "",
          reported_other_text: "",
          report_timestamp_iso: "",
          current_warranted_cue_position: "",
          current_unwarranted_cue_position: "",
          data_collection_mode: persistence.mode,
          backend_idempotency_key: backendIdempotencyKey
        };

        upsertResponse(state.pendingResponse, timedOut ? "timeout_saved" : "decision_saved");

        if (timedOut) {
          advanceTrial();
        } else if (reportWillBeShown) {
          openReportModal(userChoice, reactionTimeMs, stimulus);
        } else {
          advanceTrial();
        }
      }

      function openReportModal(userChoice, reactionTimeMs, stimulus) {
        reportError.classList.add("hidden");
        reportRtBadge.textContent = `RT ${reactionTimeMs} ms`;
        reportModalKicker.textContent = "Decision recorded";
        reportOtherContainer.classList.add("hidden");
        reportOtherText.value = "";

        const options = [
          ...stimulus.cues.map((cue) => ({
            value: `cue_${cue.id}`,
            label: cue.text,
            meta: `${cue.category}:${cue.id}`
          })),
          {
            value: "other",
            label: "Other or not sure",
            meta: "other"
          }
        ];

        reportOptions.innerHTML = options.map((option) => `
          <label class="flex cursor-pointer items-start gap-3 rounded-lg border border-slate-200 p-4 transition hover:bg-slate-50">
            <input
              type="checkbox"
              value="${escapeHtml(option.value)}"
              data-meta="${escapeHtml(option.meta)}"
              class="mt-1 h-5 w-5 rounded border-slate-300 text-slate-950 focus:ring-slate-400"
            />
            <span class="text-base font-semibold text-slate-800">${escapeHtml(option.label)}</span>
          </label>
        `).join("");

        const otherCheckbox = reportOptions.querySelector('input[value="other"]');
        otherCheckbox.addEventListener("change", () => {
          reportOtherContainer.classList.toggle("hidden", !otherCheckbox.checked);
          if (otherCheckbox.checked) {
            reportOtherText.focus();
          } else {
            reportOtherText.value = "";
          }
        });
        reportModal.classList.remove("modal-hidden");
        submitReportButton.focus();
      }

      function closeReportModal() {
        reportModal.classList.add("modal-hidden");
        reportOptions.innerHTML = "";
        reportOtherContainer.classList.add("hidden");
        reportOtherText.value = "";
      }

      function submitReport() {
        const selected = Array.from(reportOptions.querySelectorAll("input[type='checkbox']:checked"));

        if (selected.length === 0) {
          reportError.textContent = "Please select at least one option.";
          reportError.classList.remove("hidden");
          return;
        }

        const stimulus = state.trialOrder[state.currentTrialIndex];
        const reportedValues = selected.map((input) => input.value);
        const reportedMeta = selected.map((input) => input.dataset.meta);
        const reportedCueIds = reportedMeta
          .filter((value) => value.includes(":"))
          .map((value) => value.split(":")[1]);
        const reportedCueCategories = reportedMeta
          .filter((value) => value.includes(":"))
          .map((value) => value.split(":")[0]);
        const otherSelected = reportedValues.includes("other");
        const otherText = reportOtherText.value.trim();

        if (otherSelected && !otherText) {
          reportError.textContent = "Please briefly describe the other information you relied on.";
          reportError.classList.remove("hidden");
          reportOtherText.focus();
          return;
        }

        const completedResponse = {
          ...state.pendingResponse,
          report_completed: "true",
          reported_information: reportedValues.join("|"),
          reported_cue_ids: reportedCueIds.join("|"),
          reported_cue_categories: reportedCueCategories.join("|"),
          reported_warranted_cue: String(reportedCueCategories.includes("warranted")),
          reported_unwarranted_cue: String(reportedCueCategories.includes("unwarranted")),
          reported_ai_recommendation: "",
          reported_other: String(otherSelected),
          reported_other_text: otherSelected ? otherText : "",
          report_timestamp_iso: new Date().toISOString(),
          current_warranted_cue_position: stimulus.cues.findIndex((cue) => cue.category === "warranted") + 1,
          current_unwarranted_cue_position: stimulus.cues.findIndex((cue) => cue.category === "unwarranted") + 1
        };

        upsertResponse(completedResponse, "retrospective_saved");
        closeReportModal();
        advanceTrial();
      }

      function advanceTrial() {
        state.pendingResponse = null;
        state.currentTrialIndex += 1;
        state.trialStartEpochMs = 0;
        state.trialElapsedBeforeResumeMs = 0;
        state.activeDeadlineMs = null;
        checkpoint("trial_advanced");

        if (state.currentTrialIndex >= state.trialOrder.length) {
          renderPostSurvey();
        } else {
          presentCurrentTrial();
        }
      }

      function renderPostSurvey() {
        app.innerHTML = `
          <section class="mx-auto flex min-h-screen max-w-4xl items-center px-6 py-10">
            <div class="w-full rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
              <p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Final questions</p>
              <h1 class="mt-2 text-3xl font-extrabold tracking-normal text-slate-950">Post-task survey</h1>
              <div class="mt-6 grid gap-5">
                ${likertQuestion("post_ai_trust", "I trusted the AI recommendation during the task.", 5)}
                ${likertQuestion("post_time_pressure", "I felt time pressure while making decisions.", 5)}
                ${likertQuestion("post_strategy", "I tried to compare the additional AI information with the applicant data.", 5)}
                ${likertQuestion("post_attention", "Attention check: select option 4 for this item.", 5)}
              </div>

              <p id="postError" class="mt-5 hidden rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
                Please answer all post-task questions before finishing.
              </p>

              <div class="mt-8 flex justify-end">
                <button id="finishButton" type="button" class="rounded-lg bg-slate-950 px-6 py-3 text-base font-extrabold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-300">
                  Finish and Download CSV
                </button>
              </div>
            </div>
          </section>
        `;

        document.querySelectorAll('input[name^="post_"]').forEach((input) => {
          input.addEventListener("change", () => {
            state.postSurvey = {
              ...(state.postSurvey || {}),
              [input.name]: input.value
            };
            state.postSurvey.post_attention_passed = state.postSurvey.post_attention === "4";
            checkpoint("post_questionnaire_response");
            queueQuestionnaire("post", state.postSurvey);
          });
        });
        document.getElementById("finishButton").addEventListener("click", finishExperiment);
      }

      async function finishExperiment() {
        const survey = collectRadioValues(["post_ai_trust", "post_time_pressure", "post_strategy", "post_attention"]);
        if (!survey.isComplete) {
          document.getElementById("postError").classList.remove("hidden");
          return;
        }

        state.postSurvey = {
          ...survey.values,
          post_attention_passed: survey.values.post_attention === "4"
        };
        state.postSurveyCompleted = true;
        checkpoint("post_questionnaire_completed");
        queueQuestionnaire("post", state.postSurvey);

        downloadCsv();
        await persistence.flushRetryQueue({ force: true });
        renderComplete();
        await monitorBackendCompletion();
      }

      function renderComplete() {
        const localOnly = persistence.mode === "local_only";
        const pending = persistence.pendingCount();
        const serverConfirmed = Boolean(state.backendCompletion?.completed);
        const statusMessage = localOnly
          ? "Your data is checkpointed in this browser and the CSV backup has downloaded. No approved backend endpoint is configured, so server saving and automatic Prolific redirection are disabled."
          : serverConfirmed
            ? "The server confirmed that the complete session was saved."
            : state.backendCompletionError
              ? `Server confirmation is still pending: ${state.backendCompletionError}`
          : pending > 0
            ? `The CSV backup has downloaded. Waiting for ${pending} backend record${pending === 1 ? "" : "s"} to be acknowledged before completion.`
            : "All records were acknowledged. Requesting final completeness confirmation from the server.";
        app.innerHTML = `
          <section class="flex min-h-screen items-center justify-center px-6 py-12">
            <div class="w-full max-w-3xl rounded-lg border border-slate-200 bg-white p-8 text-center shadow-sm">
              <p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Complete</p>
              <h1 class="mt-2 text-3xl font-extrabold tracking-normal text-slate-950">Thank you</h1>
              <p id="backendCompletionStatus" class="mx-auto mt-5 max-w-2xl leading-7 text-slate-700">
                ${escapeHtml(statusMessage)}
              </p>
              <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">
                <button id="downloadAgainButton" type="button" class="rounded-lg bg-slate-950 px-5 py-3 text-sm font-extrabold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-300">
                  Download CSV Again
                </button>
                ${!localOnly && !serverConfirmed ? `
                  <button id="retryBackendButton" type="button" class="rounded-lg border border-slate-300 bg-white px-5 py-3 text-sm font-extrabold text-slate-800 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-200">
                    Retry Server Confirmation
                  </button>
                ` : ""}
              </div>
            </div>
          </section>
        `;

        document.getElementById("downloadAgainButton").addEventListener("click", downloadCsv);
        const retryButton = document.getElementById("retryBackendButton");
        if (retryButton) {
          retryButton.addEventListener("click", async () => {
            retryButton.disabled = true;
            state.backendCompletionError = "";
            requeueCompletedData();
            await persistence.flushRetryQueue({ force: true });
            renderComplete();
            await monitorBackendCompletion();
          });
        }
      }

      function requeueCompletedData() {
        if (!backendRequired || !state.backendSessionStarted) {
          return;
        }
        if (state.preSurveyCompleted && state.preSurvey) {
          queueQuestionnaire("pre", state.preSurvey);
        }
        if (state.postSurveyCompleted && state.postSurvey) {
          queueQuestionnaire("post", state.postSurvey);
        }
        state.responses.forEach((response) => {
          persistence.queueUpsert(response.backend_idempotency_key, "trial", response);
        });
      }

      async function monitorBackendCompletion() {
        if (!persistence.endpointConfigured) {
          return;
        }
        if (state.backendCompletion?.completed) {
          const completionUrl = String(state.backendCompletion.completionUrl || "");
          if (completionUrl.startsWith("https://app.prolific.com/submissions/complete")) {
            window.setTimeout(() => window.location.assign(completionUrl), 800);
          }
          return;
        }

        await persistence.flushRetryQueue({ force: true });
        if (!persistence.allAcknowledged()) {
          state.backendCompletionError = `${persistence.pendingCount()} record(s) still await acknowledgement.`;
          renderComplete();
          return;
        }

        try {
          const result = await backendClient.completeSession({
            experiment_session_id: state.experimentSessionId,
            session_write_token: state.sessionWriteToken
          });
          if (result.completed !== true || !String(result.completion_url || "").startsWith("https://app.prolific.com/submissions/complete")) {
            throw new Error("The server did not return a valid completion confirmation.");
          }
          state.backendCompletion = {
            completed: true,
            completedAt: result.completed_at,
            completionUrl: result.completion_url
          };
          state.backendCompletionError = "";
          checkpoint("server_completion_confirmed");
          renderComplete();
          window.setTimeout(() => {
            window.location.assign(result.completion_url);
          }, 800);
        } catch (error) {
          state.backendCompletionError = String(error?.message || "Server completeness confirmation failed.");
          checkpoint("server_completion_pending");
          renderComplete();
        }
      }

      function csvValue(value) {
        const stringValue = Array.isArray(value) ? value.join("|") : String(value ?? "");
        return `"${stringValue.replace(/"/g, '""')}"`;
      }

      function getCsvRows() {
        return state.responses.map((response) => ({
          ...response,
          backend_record_status: persistence.statusFor(response.backend_idempotency_key),
          pre_ai_familiarity: state.preSurvey?.pre_ai_familiarity ?? "",
          pre_ai_limits: state.preSurvey?.pre_ai_limits ?? "",
          pre_attention: state.preSurvey?.pre_attention ?? "",
          pre_attention_passed: String(state.preSurvey?.pre_attention_passed ?? ""),
          post_ai_trust: state.postSurvey?.post_ai_trust ?? "",
          post_time_pressure: state.postSurvey?.post_time_pressure ?? "",
          post_strategy: state.postSurvey?.post_strategy ?? "",
          post_attention: state.postSurvey?.post_attention ?? "",
          post_attention_passed: String(state.postSurvey?.post_attention_passed ?? "")
        }));
      }

      function downloadCsv() {
        const headers = [
          "participant_id",
          "study_id",
          "session_id",
          "experiment_session_id",
          "seed",
          "stimulus_set_version",
          "timing_policy_version",
          "api_contract_version",
          "client_build_version",
          "condition",
          "counterbalance_list",
          "counterbalance_list_source",
          "counterbalance_block",
          "assigned_condition",
          "trial_number",
          "trial_order",
          "presentation_order",
          "trial_id",
          "trial_type",
          "trial_phase",
          "trial_deadline_ms",
          "trial_deadline_seconds",
          "deadline_policy",
          "timer_started_timestamp_iso",
          "transition_duration_ms",
          "rt_excludes_transition",
          "report_prompt_shown",
          "report_schema_version",
          "conflict_validation_status",
          "observed_no_ai_approve_rate",
          "stimulus_type",
          "is_obvious_case",
          "intended_obvious_direction",
          "model_estimated_approval_propensity",
          "model_latent_score",
          "affordability_signal",
          "credit_signal",
          "savings_signal",
          "cue_combination",
          "warranted_cue_id",
          "warranted_cue_type",
          "warranted_cue_text",
          "warranted_cue_metric",
          "warranted_cue_metric_name",
          "unwarranted_cue_id",
          "unwarranted_cue_type",
          "unwarranted_cue_text",
          "unwarranted_cue_metric",
          "unwarranted_cue_metric_name",
          "cue_1_id",
          "cue_1_category",
          "cue_1_type",
          "cue_1_text",
          "cue_1_metric",
          "cue_1_metric_name",
          "cue_2_id",
          "cue_2_category",
          "cue_2_type",
          "cue_2_text",
          "cue_2_metric",
          "cue_2_metric_name",
          "applicant_id",
          "annual_income_eur",
          "requested_loan_eur",
          "repayment_term_years",
          "credit_score",
          "savings_eur",
          "annual_repayment_burden_pct",
          "loan_to_income_pct",
          "savings_to_loan_pct",
          "model_estimated_class",
          "ai_recommendation",
          "ai_recommendation_shown",
          "ai_matches_model_estimate_synthetic",
          "user_choice",
          "user_agreed_with_ai",
          "user_final_decision",
          "user_decision_matches_model_estimate",
          "obvious_response_matches_direction",
          "decision_rt_ms",
          "decision_rt_seconds",
          "timed_out",
          "decision_timestamp_iso",
          "report_completed",
          "reported_information",
          "reported_cue_ids",
          "reported_cue_categories",
          "reported_warranted_cue",
          "reported_unwarranted_cue",
          "reported_ai_recommendation",
          "reported_other",
          "reported_other_text",
          "report_timestamp_iso",
          "current_warranted_cue_position",
          "current_unwarranted_cue_position",
          "pre_ai_familiarity",
          "pre_ai_limits",
          "pre_attention",
          "pre_attention_passed",
          "post_ai_trust",
          "post_time_pressure",
          "post_strategy",
          "post_attention",
          "post_attention_passed",
          "data_collection_mode",
          "backend_idempotency_key",
          "backend_record_status"
        ];
        const rows = getCsvRows().map((row) => headers.map((header) => csvValue(row[header])).join(","));
        const csv = `\uFEFF${[headers.join(","), ...rows].join("\r\n")}`;
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");

        link.href = url;
        const exportIdentity = state.sessionId || state.clientInstanceId;
        link.download = `ai-loan-decision-${exportIdentity}-${timestamp}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      function handlePageExit() {
        checkpoint("page_exit");
        persistence.sendBeacon();
      }

      function renderBackendUnavailable(message) {
        app.innerHTML = `
          <section class="flex min-h-screen items-center justify-center px-6 py-12">
            <div class="w-full max-w-2xl rounded-lg border border-red-200 bg-white p-8 shadow-sm">
              <p class="text-sm font-semibold uppercase tracking-wide text-red-700">Secure session unavailable</p>
              <h1 class="mt-2 text-2xl font-extrabold text-slate-950">The experiment has not started</h1>
              <p class="mt-5 leading-7 text-slate-700">${escapeHtml(message)}</p>
              <p class="mt-3 text-sm font-semibold text-slate-600">No formal trial or questionnaire record has been sent.</p>
              <div class="mt-7 flex justify-end">
                <button id="retrySessionButton" type="button" class="rounded-lg bg-slate-950 px-5 py-3 text-sm font-extrabold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-4 focus:ring-slate-300">
                  Retry Secure Session
                </button>
              </div>
            </div>
          </section>
        `;
        document.getElementById("retrySessionButton").addEventListener("click", initializeExperiment);
      }

      async function initializeExperiment() {
        const restored = restoreSessionState(restoredSession);
        if (backendRequired) {
          app.innerHTML = `
            <section class="flex min-h-screen items-center justify-center px-6 py-12">
              <p class="text-base font-bold text-slate-700">Preparing secure experiment session...</p>
            </section>
          `;
          try {
            await ensureBackendSession({ reconcile: true });
          } catch (error) {
            renderBackendUnavailable(String(error?.message || "The backend session could not be prepared."));
            return;
          }
        }

        if (!restored) {
          checkpoint("session_initialized");
          renderWelcome();
          return;
        }

        if (state.currentTrialIndex >= state.trialOrder.length) {
          if (state.postSurveyCompleted) {
            renderComplete();
            await monitorBackendCompletion();
          } else {
            renderPostSurvey();
          }
          return;
        }

        renderResume();
      }

      window.addEventListener("pagehide", handlePageExit);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          handlePageExit();
        }
      });
      submitReportButton.addEventListener("click", submitReport);
      initializeExperiment().catch((error) => {
        renderBackendUnavailable(String(error?.message || "The experiment could not be initialized."));
      });
    })();
  </script>
</body>
</html>
