<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCI Pilot Study - AI Loan Advice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .likert-input:checked + span {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.24);
    }

    .field-highlight {
      border-color: #ef4444;
      background: #fff1f2;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main id="app" class="min-h-screen"></main>

  <script>
    const cues = [
      { "id": "1_high_high", "type": "Feature Explanation", "html": "<b>AI Note:</b> The applicant's Debt-to-Income ratio is 62% (€28k/€45k), which strictly exceeds the bank's safe threshold of 40%." },
      { "id": "2_high_med", "type": "Historical Reliability", "html": "<b>AI Note:</b> Based on our database, this AI model has an 88% historical accuracy rate when predicting loan defaults for applicants with credit scores below 650." },
      { "id": "3_high_low", "type": "Black-Box Analysis", "html": "<b>AI Note:</b> Based on our proprietary Deep-Web behavioral scanning and alternative data mining, the applicant's latent semantic risk profile is severely high (8.9/10)." },
      { "id": "4_med_high", "type": "Data Highlighting", "html": "<b>AI Note:</b> Please pay close attention to the highlighted fields. <br><i>Total Debt and Credit Score are highlighted in red on the applicant profile.</i>" },
      { "id": "5_med_med", "type": "Industry Rule", "html": "<b>AI Note:</b> General banking guidelines suggest that applicants with a Credit Score below 650 often pose a moderately elevated default risk." },
      { "id": "6_med_low", "type": "Raw Confidence", "html": "<b>AI Confidence Level: <span style='font-size:2em; color:green;'>99.2%</span></b>" },
      { "id": "7_low_high", "type": "Useless Fact", "html": "<b>System Check:</b> The applicant's listed age is exactly 34 years old." },
      { "id": "8_low_med", "type": "Social Consensus", "html": "<b>AI Note:</b> 90% of senior loan officers in the network agree with this type of AI assessment." },
      { "id": "9_low_low", "type": "Visual Badge", "html": "<div style='text-align:center;'><span style='font-size:3em;'>🛡️</span><br><b>AI-Verified Safe Decision</b></div>" }
    ];

    const applicant = {
      age: "34",
      income: "€45,000",
      debt: "€28,000",
      creditScore: "620 (Fair)"
    };

    const state = {
      trialOrder: [],
      currentTrialIndex: 0,
      trialStartTime: 0,
      responses: []
    };

    const app = document.getElementById("app");

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeCsv(value) {
      const stringValue = String(value ?? "");
      return `"${stringValue.replace(/"/g, '""')}"`;
    }

    function renderWelcome() {
      app.innerHTML = `
        <section class="flex min-h-screen items-center justify-center px-6 py-12">
          <div class="w-full max-w-3xl rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
            <p class="mb-3 text-sm font-semibold uppercase tracking-wide text-blue-700">HCI Pilot Study</p>
            <h1 class="text-3xl font-semibold tracking-tight text-slate-950">AI Loan Advice Evaluation</h1>
            <p class="mt-5 leading-7 text-slate-700">
              You will review a fixed applicant profile and nine different AI messages. For each trial,
              rate the message on informativeness and verifiability using the 7-point scales.
            </p>
            <p class="mt-4 leading-7 text-slate-700">
              Please make each judgment based only on the information visible on the screen. Your response time
              for each trial will be recorded for pilot analysis.
            </p>
            <button id="startButton" class="mt-8 rounded-md bg-blue-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-200">
              Start Experiment
            </button>
          </div>
        </section>
      `;

      document.getElementById("startButton").addEventListener("click", startExperiment);
    }

    function startExperiment() {
      state.trialOrder = shuffle(cues);
      state.currentTrialIndex = 0;
      state.responses = [];
      renderTrial();
    }

    function profileRow(label, value, key, highlight) {
      const highlightClass = highlight ? "field-highlight" : "border-slate-200 bg-slate-50";
      return `
        <div class="${highlightClass} rounded-md border p-4 transition-colors" data-field="${key}">
          <dt class="text-sm font-medium text-slate-600">${label}</dt>
          <dd class="mt-1 text-xl font-semibold text-slate-950">${value}</dd>
        </div>
      `;
    }

    function likertQuestion(id, label) {
      const options = Array.from({ length: 7 }, (_, index) => index + 1).map(value => `
        <label class="flex cursor-pointer flex-col items-center gap-2">
          <input class="likert-input sr-only" type="radio" name="${id}" value="${value}" />
          <span class="flex h-11 w-11 items-center justify-center rounded-full border border-slate-300 bg-white text-sm font-semibold text-slate-700 transition">
            ${value}
          </span>
        </label>
      `).join("");

      return `
        <fieldset class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
          <legend class="text-base font-semibold text-slate-950">${label}</legend>
          <div class="mt-5 flex items-center justify-between gap-2">${options}</div>
          <div class="mt-3 flex justify-between text-xs font-medium text-slate-500">
            <span>1 = Strongly Disagree</span>
            <span>7 = Strongly Agree</span>
          </div>
        </fieldset>
      `;
    }

    function renderTrial() {
      const cue = state.trialOrder[state.currentTrialIndex];
      const trialNumber = state.currentTrialIndex + 1;
      const progressPercent = (trialNumber / state.trialOrder.length) * 100;
      const shouldHighlight = cue.id === "4_med_high";

      app.innerHTML = `
        <div class="mx-auto flex min-h-screen max-w-7xl flex-col px-5 py-5 sm:px-8">
          <header class="mb-5 rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <p class="text-sm font-semibold text-blue-700">Trial ${trialNumber} of ${state.trialOrder.length}</p>
                <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-950">Loan Application Review</h1>
              </div>
              <p class="text-sm text-slate-600">Recommendation context evaluation</p>
            </div>
            <div class="mt-4 h-3 overflow-hidden rounded-full bg-slate-200">
              <div class="h-full rounded-full bg-blue-700 transition-all" style="width:${progressPercent}%"></div>
            </div>
          </header>

          <section class="grid flex-1 gap-5 lg:grid-cols-[0.92fr_1.08fr]">
            <article class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
              <div class="mb-5 flex items-start justify-between gap-4">
                <div>
                  <p class="text-sm font-semibold uppercase tracking-wide text-slate-500">Applicant Profile</p>
                  <h2 class="mt-1 text-xl font-semibold text-slate-950">Loan Applicant A</h2>
                </div>
                <span class="rounded-md border border-slate-200 px-3 py-1 text-sm font-medium text-slate-600">Static Data</span>
              </div>
              <dl class="grid gap-4 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2">
                ${profileRow("Age", applicant.age, "age", false)}
                ${profileRow("Annual Income", applicant.income, "income", false)}
                ${profileRow("Total Debt", applicant.debt, "debt", shouldHighlight)}
                ${profileRow("Credit Score", applicant.creditScore, "creditScore", shouldHighlight)}
              </dl>
            </article>

            <article class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <p class="text-sm font-semibold uppercase tracking-wide text-slate-500">AI Advice</p>
                  <h2 class="mt-1 text-xl font-semibold text-slate-950">Automated Decision Support</h2>
                </div>
                <span class="rounded-md bg-red-100 px-3 py-1 text-sm font-bold text-red-700">REJECT</span>
              </div>
              <div class="mt-6 rounded-lg border border-slate-200 bg-slate-50 p-5">
                <p class="mb-3 text-sm font-semibold text-slate-600">Cue Type: ${cue.type}</p>
                <div class="leading-7 text-slate-800">${cue.html}</div>
              </div>
            </article>
          </section>

          <section class="mt-5 grid gap-4 lg:grid-cols-2">
            ${likertQuestion("informativeness", "Informativeness: Does this AI note give you factual reasons or logical calculations about this specific applicant, rather than just vague feelings or peer pressure?")}
            ${likertQuestion("verifiability", "Verifiability: Can you use the raw data on the left side of the screen (Salary, Debt, etc.) to do the math or visually confirm that the AI is telling the truth?")}
          </section>

          <footer class="mt-5 flex justify-end">
            <button id="nextButton" disabled class="rounded-md bg-blue-700 px-6 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-200 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500 disabled:shadow-none">
              ${trialNumber === state.trialOrder.length ? "Finish" : "Next"}
            </button>
          </footer>
        </div>
      `;

      state.trialStartTime = performance.now();
      document.querySelectorAll("input[type='radio']").forEach(input => {
        input.addEventListener("change", updateNextButton);
      });
      document.getElementById("nextButton").addEventListener("click", submitTrial);
    }

    function updateNextButton() {
      const informativeness = document.querySelector("input[name='informativeness']:checked");
      const verifiability = document.querySelector("input[name='verifiability']:checked");
      document.getElementById("nextButton").disabled = !(informativeness && verifiability);
    }

    function submitTrial() {
      const cue = state.trialOrder[state.currentTrialIndex];
      const reactionTimeMs = Math.round(performance.now() - state.trialStartTime);
      const informativeness = document.querySelector("input[name='informativeness']:checked").value;
      const verifiability = document.querySelector("input[name='verifiability']:checked").value;

      state.responses.push({
        trial_number: state.currentTrialIndex + 1,
        cue_id: cue.id,
        cue_type: cue.type,
        ai_recommendation: "REJECT",
        informativeness_rating: informativeness,
        verifiability_rating: verifiability,
        reaction_time_ms: reactionTimeMs,
        reaction_time_seconds: (reactionTimeMs / 1000).toFixed(3),
        timestamp_iso: new Date().toISOString()
      });

      state.currentTrialIndex += 1;
      if (state.currentTrialIndex >= state.trialOrder.length) {
        renderEnd();
      } else {
        renderTrial();
      }
    }

    function renderEnd() {
      app.innerHTML = `
        <section class="flex min-h-screen items-center justify-center px-6 py-12">
          <div class="w-full max-w-3xl rounded-lg border border-slate-200 bg-white p-8 text-center shadow-sm">
            <p class="mb-3 text-sm font-semibold uppercase tracking-wide text-blue-700">Complete</p>
            <h1 class="text-3xl font-semibold tracking-tight text-slate-950">Thank You</h1>
            <p class="mx-auto mt-5 max-w-2xl leading-7 text-slate-700">
              The pilot study trials are complete. You can now download the collected ratings, cue order,
              and reaction times as a CSV file.
            </p>
            <button id="downloadButton" class="mt-8 rounded-md bg-blue-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-200">
              Download Data as CSV
            </button>
          </div>
        </section>
      `;

      document.getElementById("downloadButton").addEventListener("click", downloadCsv);
    }

    function downloadCsv() {
      const headers = [
        "trial_number",
        "cue_id",
        "cue_type",
        "ai_recommendation",
        "informativeness_rating",
        "verifiability_rating",
        "reaction_time_ms",
        "reaction_time_seconds",
        "timestamp_iso"
      ];
      const rows = state.responses.map(response => headers.map(header => escapeCsv(response[header])).join(","));
      const csv = [headers.join(","), ...rows].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");

      link.href = url;
      link.download = `pilot-study-ai-loan-advice-${timestamp}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    renderWelcome();
  </script>
</body>
</html>
